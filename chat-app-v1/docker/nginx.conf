# Local load balancer in front of two chat instances (docker compose --profile lb).
events {}

http {
  # Only send "Connection: upgrade" for real WebSocket handshakes.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream chat {
    # Connections are long-lived, so balance on open connections, not round robin:
    # after a deploy round robin leaves the older instance overloaded.
    least_conn;
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://chat;
      proxy_http_version 1.1;

      # WebSocket upgrade. No sticky sessions are needed: once upgraded, a socket
      # is pinned to its instance for its whole life, and every HTTP route is stateless.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # nginx closes idle proxied connections after 60 s by default; the server's
      # heartbeat is every ~25 s, but keep generous headroom.
      # Fail over fast when an instance is gone (a stopped container just blackholes packets).
      proxy_connect_timeout 2s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # A draining instance answers 503 to new upgrades; try the other one.
      proxy_next_upstream error timeout http_503;
    }
  }
}
