# Local dev + test services. Dev: 5432 / 6379. Test: 5433 / 6380 (tmpfs, disposable).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: chat, POSTGRES_PASSWORD: chat, POSTGRES_DB: chat_test }
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis-test:
    image: redis:7-alpine
    ports: ["6380:6379"]

  # --- Redis Cluster (3 masters) for sharded Pub/Sub:  docker compose --profile cluster up -d
  redis-cluster:
    profiles: ["cluster"]
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/cluster.sh"]
    volumes: ["./docker/redis-cluster.sh:/cluster.sh:ro"]
    ports: ["7001:7001", "7002:7002", "7003:7003"]

  # --- Two instances behind nginx:  docker compose --profile lb up -d --build
  app1: &app
    profiles: ["lb"]
    build: .
    environment: &app-env
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INSTANCE_ID: app1
      NODE_ENV: development
    depends_on: [postgres, redis]
    ports: ["3001:3000"]
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports: ["3002:3000"]
  nginx:
    profiles: ["lb"]
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [app1, app2]

volumes:
  pgdata:
